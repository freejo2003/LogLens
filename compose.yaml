services:
  db:
    image: postgres:18
    container_name: loglens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: loglens
      POSTGRES_USER: loglens
      POSTGRES_PASSWORD: loglens_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: loglens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data: