name: loglens

x-application-environment: &application-environment
  DJANGO_ENV: ${DJANGO_ENV:-development}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in .env}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set DJANGO_CSRF_TRUSTED_ORIGINS in .env}
  DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-false}
  DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-0}
  DJANGO_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_HSTS_INCLUDE_SUBDOMAINS:-false}
  DJANGO_HSTS_PRELOAD: ${DJANGO_HSTS_PRELOAD:-false}
  POSTGRES_DB: ${POSTGRES_DB:-loglens}
  POSTGRES_USER: ${POSTGRES_USER:-loglens}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: 5432
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  PRIVATE_MEDIA_ROOT: /var/lib/loglens/private_media
  LOGLENS_MAX_UPLOAD_SIZE: ${LOGLENS_MAX_UPLOAD_SIZE:-26214400}
  LOGLENS_MAX_UPLOAD_BATCH_SIZE: ${LOGLENS_MAX_UPLOAD_BATCH_SIZE:-52428800}
  LOGLENS_MAX_UPLOAD_COUNT: ${LOGLENS_MAX_UPLOAD_COUNT:-10}
  LOGLENS_MAX_DOCX_UNCOMPRESSED_SIZE: ${LOGLENS_MAX_DOCX_UNCOMPRESSED_SIZE:-104857600}
  LOGLENS_MAX_EXTRACTED_CHARACTERS: ${LOGLENS_MAX_EXTRACTED_CHARACTERS:-5242880}
  LOGLENS_MAX_TEXT_SEGMENTS: ${LOGLENS_MAX_TEXT_SEGMENTS:-100000}
  LOGLENS_MAX_PDF_PAGES: ${LOGLENS_MAX_PDF_PAGES:-1000}
  LOGLENS_DOC_CONVERSION_TIMEOUT: ${LOGLENS_DOC_CONVERSION_TIMEOUT:-60}
  LOGLENS_MAX_NAIVE_COMPARISONS: ${LOGLENS_MAX_NAIVE_COMPARISONS:-5000000}
  LOGLENS_MAX_SEARCH_MATCHES: ${LOGLENS_MAX_SEARCH_MATCHES:-100000}
  CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-300}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-330}
  CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
  SMTP_HOST: ${SMTP_HOST:-localhost}
  SMTP_PORT: ${SMTP_PORT:-25}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: postgres:18.6-alpine3.24@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-loglens}
      POSTGRES_USER: ${POSTGRES_USER:-loglens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 768m
    cpus: 1.0

  redis:
    image: redis:8.10.1-alpine3.23@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - redis-server
      - --save
      - "60"
      - "1000"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --protected-mode
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m
    cpus: 0.5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *application-environment
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers 3 --timeout 60 --access-logfile - --error-logfile -"
    volumes:
      - private_media:/var/lib/loglens/private_media
      - static_files:/app/staticfiles
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request; request = urllib.request.Request(
          'http://127.0.0.1:8000/health/', headers={
          'Host': os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip(),
          'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *application-environment
    command: celery -A config worker --loglevel=INFO --concurrency=${CELERY_WORKER_CONCURRENCY:-2} --max-tasks-per-child=100
    volumes:
      - private_media:/var/lib/loglens/private_media
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128

  proxy:
    image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOGLENS_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=128m,uid=101,gid=101,mode=1777
      - /var/run:rw,noexec,nosuid,size=8m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/static:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --header='Host: localhost' --header='X-Forwarded-Proto: https' -q -O /dev/null http://127.0.0.1:8080/health/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

volumes:
  postgres_data:
  redis_data:
  private_media:
  static_files:
